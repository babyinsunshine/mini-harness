[project]
name = "mini-harness"
version = "0.1.0"
description = "A readable, modular CLI coding harness built on LangChain and LangGraph."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.6,<2",
    "langgraph>=1.2.16,<2",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1,<2"]
openai = ["langchain-openai>=1,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[project.scripts]
mini-harness = "mini_harness.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
